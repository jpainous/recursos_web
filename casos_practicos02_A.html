<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casos Prácticos – Sistema Musculoesquelético (Fisiología de la Danza)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#f0f2f5;color:#333;line-height:1.6}
.top-bar{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:30px 20px;text-align:center}
.top-bar h1{font-size:1.8em;margin-bottom:5px}
.top-bar p{opacity:.85;font-size:.95em}
.wrap{max-width:960px;margin:0 auto;padding:20px}

/* PERSONALIZACIÓN */
.personal{background:#fff;border-radius:14px;padding:28px 32px;margin-bottom:24px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.personal h2{color:#1a1a2e;margin-bottom:16px;font-size:1.3em}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid label{font-weight:600;font-size:.9em;color:#555;display:block;margin-bottom:4px}
.form-grid input{width:100%;padding:10px 14px;border:2px solid #ddd;border-radius:8px;font-size:1em;transition:.3s}
.form-grid input:focus{border-color:#667eea;outline:none}
.time-row{display:flex;gap:14px;margin-top:14px}
.time-row div{flex:1}
.btn-start{margin-top:16px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;padding:12px 30px;border-radius:8px;font-size:1.05em;cursor:pointer;transition:.3s}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(102,126,234,.4)}

/* BLOQUES */
.block{background:#fff;border-radius:14px;margin-bottom:24px;box-shadow:0 4px 20px rgba(0,0,0,.08);overflow:hidden;display:none}
.block.active{display:block}
.block-header{padding:22px 28px;color:#fff;font-size:1.2em;font-weight:700}
.block-header small{display:block;font-weight:400;font-size:.75em;opacity:.9;margin-top:4px}
.bh1{background:linear-gradient(135deg,#667eea,#764ba2)}
.bh2{background:linear-gradient(135deg,#11998e,#38ef7d)}
.bh3{background:linear-gradient(135deg,#ee5a6f,#ff6b6b)}
.bh4{background:linear-gradient(135deg,#f7971e,#ffd200)}
.bh5{background:linear-gradient(135deg,#6a11cb,#2575fc)}
.bh6{background:linear-gradient(135deg,#fc4a1a,#f7b733)}
.bh7{background:linear-gradient(135deg,#0f2027,#2c5364)}
.block-body{padding:20px 28px 28px}

/* CASO */
.caso{background:#fafbfc;border:1px solid #e8ecf1;border-radius:10px;padding:20px;margin-bottom:18px;position:relative}
.caso-tag{display:inline-block;font-size:.7em;font-weight:700;padding:3px 10px;border-radius:20px;color:#fff;margin-bottom:10px}
.caso h4{font-size:1.05em;color:#1a1a2e;margin-bottom:10px}
.caso .escenario{font-style:italic;color:#555;margin-bottom:12px;font-size:.95em}
.opts label{display:block;padding:10px 14px;margin:5px 0;background:#fff;border:2px solid #e0e0e0;border-radius:8px;cursor:pointer;transition:.25s;font-size:.95em}
.opts label:hover{border-color:#667eea;background:#f5f3ff}
.opts input[type=radio]{margin-right:8px;accent-color:#667eea}
.opts label.sel{border-color:#667eea;background:#ede9fe}
.opts label.correct{border-color:#2e7d32;background:#e8f5e9}
.opts label.wrong{border-color:#c62828;background:#ffebee}
.explicacion-user{width:100%;margin-top:10px;padding:10px;border:2px solid #ddd;border-radius:8px;font-size:.9em;resize:vertical;min-height:50px}
.explicacion-user:focus{border-color:#667eea;outline:none}
.btn-val{margin-top:10px;background:#667eea;color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:.9em;transition:.3s}
.btn-val:hover{background:#5a6fd6}
.btn-val:disabled{background:#bbb;cursor:default}
.feedback{margin-top:10px;padding:12px 16px;border-radius:8px;font-size:.92em;display:none;line-height:1.6}
.feedback.ok{display:block;background:#e8f5e9;border-left:4px solid #2e7d32;color:#1b5e20}
.feedback.bad{display:block;background:#ffebee;border-left:4px solid #c62828;color:#b71c1c}

/* NAV */
.nav-bar{display:flex;justify-content:space-between;align-items:center;margin:20px 0}
.btn-nav{padding:10px 24px;border:none;border-radius:8px;font-size:1em;cursor:pointer;transition:.3s;color:#fff}
.btn-prev{background:#78909c}
.btn-next{background:#667eea}
.btn-nav:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.btn-nav:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
.progress{font-size:.9em;color:#666;font-weight:600}

/* ENVÍO */
.send-section{background:#fff;border-radius:14px;padding:28px 32px;margin-bottom:40px;box-shadow:0 4px 20px rgba(0,0,0,.08);text-align:center;display:none}
.send-section h2{color:#1a1a2e;margin-bottom:10px}
.score-display{font-size:2em;font-weight:700;color:#667eea;margin:16px 0}
.btn-send{background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff;border:none;padding:14px 36px;border-radius:8px;font-size:1.1em;cursor:pointer;transition:.3s;margin-top:10px}
.btn-send:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(46,125,50,.4)}
.btn-print{background:linear-gradient(135deg,#1565c0,#1976d2);color:#fff;border:none;padding:14px 36px;border-radius:8px;font-size:1.1em;cursor:pointer;transition:.3s;margin-top:10px;margin-left:10px}

@media(max-width:600px){
  .form-grid{grid-template-columns:1fr}
  .time-row{flex-direction:column}
  .top-bar h1{font-size:1.3em}
}
@media print{
  .btn-val,.btn-nav,.btn-start,.btn-send,.btn-print,.nav-bar{display:none!important}
  .block{display:block!important;break-inside:avoid}
  .send-section{display:block!important}
}
</style>
</head>
<body>

<div class="top-bar">
  <h1>🩰 Casos Prácticos – Sistema Musculoesquelético</h1>
  <p>Fisiología aplicada a la Danza · Curso 2026-2027 · 70 casos en 7 bloques temáticos</p>
</div>

<div class="wrap">

<!-- PERSONALIZACIÓN -->
<div class="personal" id="personalForm">
  <h2>📝 Datos del alumnado</h2>
  <div class="form-grid">
    <div><label>Nombre completo</label><input type="text" id="stuName" placeholder="Ej: María López García"></div>
    <div><label>Email</label><input type="email" id="stuEmail" placeholder="Ej: maria@escuela.com"></div>
    <div><label>Email de la professora</label><input type="email" id="profEmail" placeholder="Ej: celia.painous@escuela.com"></div>
    <div><label>Fecha</label><input type="date" id="stuDate"></div>
  </div>
  <div class="time-row">
    <div><label>Hora de inicio</label><input type="time" id="startTime"></div>
    <div><label>Hora de finalización</label><input type="time" id="endTime" disabled></div>
  </div>
  <button class="btn-start" onclick="startTest()">🚀 Comenzar test</button>
</div>

<!-- CONTENEDOR DE BLOQUES -->
<div id="blocksContainer"></div>

<!-- NAVEGACIÓN -->
<div class="nav-bar" id="navBar" style="display:none">
  <button class="btn-nav btn-prev" id="btnPrev" onclick="navBlock(-1)">⬅ Anterior</button>
  <span class="progress" id="progressText"></span>
  <button class="btn-nav btn-next" id="btnNext" onclick="navBlock(1)">Siguiente ➡</button>
</div>

<!-- ENVÍO -->
<div class="send-section" id="sendSection">
  <h2>📊 Resultado final</h2>
  <div class="score-display" id="scoreDisplay"></div>
  <p id="scoreDetail"></p>
  <button class="btn-send" onclick="sendEmail()">📧 Enviar a la professora por email</button>
  <button class="btn-print" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
</div>

</div>

<script>
// ===================== DATOS DE LOS 70 CASOS =====================
const DATA = [
// ─── BLOQUE 1: HOMEOSTASIS Y REGULACIÓN (Pres I, Diapos 2-7) ───
{
  block:0, tag:"Homeostasis", tagColor:"#667eea",
  ref:"Presentación I · Diapositivas 2-7",
  q:"Durante un ensayo de <em>grand allegro</em> de 20 minutos, Lucía nota que su piel está enrojecida y empapada de sudor. ¿Qué variable homeostática está intentando regular su cuerpo principalmente?",
  opts:["a) La glucosa sanguínea","b) La temperatura corporal","c) La presión arterial","d) El pH del líquido intracelular"],
  correct:1,
  expl:"La sudoración y la vasodilatación cutánea (piel enrojecida) son mecanismos de termorregulación. El cuerpo disipa el calor generado por la contracción muscular para mantener la temperatura dentro del rango de 36-37,5 °C (Diapositiva 4: Homeostasis)."

{
  block:0, tag:"Homeostasis", tagColor:"#667eea",
  ref:"Presentación I · Diapositiva 3",

  correct:1,
  expl:"El agua corporal total es aproximadamente el 60% del peso (65 × 0,6 ≈ 39 L). De esa agua, el 60-65% está dentro de las células (LIC) y el 35-40% fuera (LEC) (Diapositiva 3: Líquido intra y extracelular)."
},
{
  block:0, tag:"Homeostasis", tagColor:"#667eea",
  ref:"Presentación I · Diapositiva 4",
  q:"Antes de una audición importante, a Marc le miden la glucosa en sangre y obtienen 105 mg/dL. ¿Este valor es compatible con la homeostasis normal?",
  opts:["a) No, está demasiado alto; lo normal es menos de 60 mg/dL","b) No, está demasiado bajo; lo normal es más de 150 mg/dL","c) Sí, está dentro del rango normal de 75-110 mg/dL","d) No se puede saber sin medir el pH"],
  correct:2,
  expl:"El rango normal de glucosa en sangre es de 75-110 mg/dL (Diapositiva 4). Un valor de 105 mg/dL está dentro de ese rango, por lo que es compatible con la homeostasis."

  ref:"Presentación I · Diapositiva 5",

  correct:1,
  expl:"El sistema nervioso genera respuestas rápidas y precisas mediante impulsos eléctricos (Diapositiva 5). La activación inmediata del corazón y los músculos antes de salir a escena es una respuesta nerviosa. El sistema endocrino actúa más lentamente (hormonas)."
},
{
  block:0, tag:"Homeostasis", tagColor:"#667eea",
  ref:"Presentación I · Diapositiva 6",
  q:"Después de una clase intensa de 90 minutos, la professora pide a las alumnas que se tumben en el suelo y respiren lentamente durante 5 minutos. Desde el punto de vista fisiológico, ¿por qué es importante este reposo?",
  opts:["a) Para que los músculos se queden rígidos y mantengan la forma","b) Para que el cuerpo restaure las condiciones homeostáticas del medio interno (LEC)","c) Para que la glucosa baje a cero","d) Para que el sistema nervioso se desconecte completamente"],
  correct:1,
  expl:"La actividad física rompe el equilibrio del medio interno (LEC). El período de reposo permite restaurar las condiciones homeostáticas: normalizar pH, temperatura, glucosa, etc. (Diapositiva 6: Homeostasis en el movimiento)."
},
{
  block:0, tag:"Homeostasis", tagColor:"#667eea",
  ref:"Presentación I · Diapositiva 7",
  q:"Durante el parto, las contracciones uterinas provocan la liberación de oxitocina, que a su vez provoca contracciones más fuertes, que liberan más oxitocina, hasta que se produce el nacimiento. ¿Qué tipo de mecanismo es este?",
  opts:["a) Retroalimentación negativa","b) Homeostasis pasiva","c) Retroalimentación positiva","d) Regulación endocrina lenta"],
  correct:2,
  expl:"En la retroalimentación positiva, la respuesta amplifica el estímulo inicial, alejando la variable del punto de ajuste hasta completar un proceso (Diapositiva 7). Las contracciones del parto son el ejemplo clásico."
},
{
  block:0, tag:"Homeostasis", tagColor:"#667eea",
  ref:"Presentación I · Diapositiva 4",
  q:"Un bailarín llega a urgencias después de un ensayo bajo el sol sin beber agua. Su presión arterial es 85/50 mmHg. ¿Qué indica este valor?",

  correct:1,
  expl:"La presión arterial normal es aproximadamente 120/80 mmHg (Diapositiva 4). Un valor de 85/50 está muy por debajo, lo que sugiere deshidratación y pérdida de volumen de líquido extracelular."
},
{
  block:0, tag:"Homeostasis", tagColor:"#667eea",

  correct:1,
  expl:"El LEC constituye el 35-40% del agua corporal total y es el «medio interno» que baña las células. El 60-65% corresponde al líquido intracelular (LIC) (Diapositiva 3)."
},
{
  block:0, tag:"Homeostasis", tagColor:"#667eea",
  ref:"Presentación I · Diapositiva 5",
  q:"Durante una función de 2 horas, el cuerpo de un bailarín libera adrenalina de forma sostenida para mantener el estado de alerta. ¿Qué sistema de regulación es responsable de esta respuesta prolongada?",
  opts:["a) El sistema nervioso somático","b) El sistema endocrino, mediante hormonas transportadas por la sangre","c) El sistema muscular, mediante contracciones","d) El sistema óseo, mediante remodelación"],
  correct:1,
  expl:"El sistema endocrino produce respuestas lentas pero duraderas mediante hormonas como la adrenalina, que viajan por la sangre (Diapositiva 5). El sistema nervioso actúa más rápido pero de forma más breve."
},
{
  block:0, tag:"Homeostasis", tagColor:"#667eea",
  ref:"Presentación I · Diapositiva 4",
  q:"Después de un ejercicio muy intenso, el pH sanguíneo de un bailarín baja temporalmente a 7,30. ¿Qué significa esto?",

  correct:1,
  expl:"El pH normal es 7,35-7,45 (Diapositiva 4). Un valor de 7,30 está por debajo del rango, lo que indica acidosis leve, probablemente por acumulación de CO₂ y ácido láctico durante el ejercicio intenso."
},

// ─── BLOQUE 2: ESTRUCTURA MUSCULAR Y SARCÓMERO (Pres I, Diapos 8-11) ───
{
  block:1, tag:"Músculo y Sarcómero", tagColor:"#11998e",
  ref:"Presentación I · Diapositiva 8",
  q:"Una bailarina utiliza sus cuádriceps para saltar, su corazón para bombear sangre y su estómago para digerir la comida. ¿Qué tipos de tejido muscular corresponden a cada acción, en ese orden?",
  opts:["a) Liso, cardíaco, esquelético","b) Esquelético, liso, cardíaco","c) Esquelético, cardíaco, liso","d) Cardíaco, esquelético, liso"],
  correct:2,
  expl:"Cuádriceps = músculo esquelético (voluntario). Corazón = músculo cardíaco (involuntario, estriado). Estómago = músculo liso (involuntario, no estriado) (Diapositiva 8: Tres tipos de músculos)."
},
{
  block:1, tag:"Músculo y Sarcómero", tagColor:"#11998e",
  ref:"Presentación I · Diapositiva 9",
  q:"Al observar una fibra muscular esquelética al microscopio, ¿qué características la distinguen de otras células del cuerpo?",
  opts:["a) Es pequeña, esférica y tiene un solo núcleo","b) Es alargada, cilíndrica y multinucleada","c) Es plana y sin núcleo","d) Tiene forma de estrella con muchas prolongaciones"],
  correct:1,
  expl:"La fibra muscular esquelética es una célula alargada, cilíndrica y multinucleada (tiene muchos núcleos), lo que la hace única en el cuerpo humano (Diapositiva 9: La fibra muscular)."
},
{
  block:1, tag:"Músculo y Sarcómero", tagColor:"#11998e",
  ref:"Presentación I · Diapositiva 10",
  q:"¿Cuál es la unidad funcional y contráctil básica del músculo esquelético?",

  correct:2,
  expl:"El sarcómero es la unidad funcional y contráctil básica, definido como el segmento entre dos líneas Z consecutivas (Diapositiva 10: Niveles de Organización)."
},
{
  block:1, tag:"Músculo y Sarcómero", tagColor:"#11998e",
  ref:"Presentación I · Diapositiva 11",
  q:"Durante una contracción muscular, ¿qué ocurre con la Banda A del sarcómero?",
  opts:["a) Se estrecha hasta desaparecer","b) Se alarga el doble","c) Permanece constante, ya que corresponde a la longitud de la miosina","d) Se divide en dos bandas más pequeñas"],
  correct:2,
  expl:"La Banda A (longitud de los filamentos gruesos de miosina) permanece constante durante la contracción. Lo que se estrecha es la Banda I, al acercarse las líneas Z (Diapositiva 11: Estructura del Sarcómero)."
},
{
  block:1, tag:"Músculo y Sarcómero", tagColor:"#11998e",
  ref:"Presentación I · Diapositiva 11",

  correct:1,
  expl:"Durante la contracción, los filamentos de actina se deslizan hacia el centro del sarcómero, acercando las líneas Z entre sí. Esto hace que la Banda I (zona de solo actina) se estreche (Diapositiva 11)."

{
  block:1, tag:"Músculo y Sarcómero", tagColor:"#11998e",
  ref:"Presentación I · Diapositiva 10",
  q:"¿Cuáles son los dos tipos de miofilamentos que componen el sarcómero?",

  correct:1,
  expl:"Los miofilamentos gruesos están formados por miosina y los delgados por actina. Su interacción produce la contracción muscular (Diapositiva 10: Niveles de Organización)."

{

  correct:1,
  expl:"Al estar en serie, el pequeño acortamiento de cada uno de los ~100.000 sarcómeros se suma, produciendo un acortamiento total apreciable del músculo completo (Diapositiva 11)."

{

{

  q:"¿Cuál de las siguientes NO es una función del músculo esquelético?",

// ===================== LÓGICA DE LA APLICACIÓN =====================
const BLOCK_NAMES = [
  {name:"Homeostasis y Regulación", cls:"bh1", ref:"Presentación I · Diapositivas 2-7"},
  {name:"Estructura Muscular y Sarcómero", cls:"bh2", ref:"Presentación I · Diapositivas 8-11"},
  {name:"Contracción Muscular y Unidad Motora", cls:"bh3", ref:"Presentación I · Diapositivas 12-16"},
  {name:"Componentes del Sistema y Biomecánica", cls:"bh4", ref:"Presentación II · Secciones 1-5"},
  {name:"Sistema Óseo", cls:"bh5", ref:"Presentación II · Secciones 6-11"},
  {name:"Articulaciones y Cartílago", cls:"bh6", ref:"Presentación II · Secciones 12-14"},
  {name:"Planos de Movimiento y Propiocepción", cls:"bh7", ref:"Presentación II · Secciones 15-16"}
];

let currentBlock = 0;
let answered = {};

function buildBlocks(){
  const c = document.getElementById('blocksContainer');
  let html = '';
  BLOCK_NAMES.forEach((b,bi) => {
    const cases = DATA.filter(d => d.block === bi);
    html += `<div class="block" id="block${bi}">
      <div class="block-header ${b.cls}">${bi+1}. ${b.name}<small>${b.ref} · 10 casos prácticos</small></div>
      <div class="block-body">`;
    cases.forEach((cs,ci) => {
      const gid = `b${bi}c${ci}`;
      html += `<div class="caso" id="caso_${gid}">
        <span class="caso-tag" style="background:${cs.tagColor}">${cs.tag}</span>
        <span style="font-size:.75em;color:#888;margin-left:8px">📖 ${cs.ref}</span>
        <h4>Caso ${ci+1}: ${cs.q}</h4>
        <div class="opts" id="opts_${gid}">`;
      cs.opts.forEach((o,oi) => {
        html += `<label id="lbl_${gid}_${oi}"><input type="radio" name="r_${gid}" value="${oi}" onchange="selectOpt('${gid}',${oi})"> ${o}</label>`;
      });
      html += `</div>
        <textarea class="explicacion-user" id="exp_${gid}" placeholder="✏️ Explica brevemente por qué has elegido esta respuesta..."></textarea>
        <button class="btn-val" id="btn_${gid}" onclick="validate('${gid}',${bi},${ci})" disabled>✅ Validar respuesta</button>
        <div class="feedback" id="fb_${gid}"></div>
      </div>`;
    });
    html += `</div></div>`;
  });
  c.innerHTML = html;
}

function selectOpt(gid, oi){
  document.getElementById(`btn_${gid}`).disabled = false;
  const labels = document.querySelectorAll(`#opts_${gid} label`);
  labels.forEach(l => l.classList.remove('sel'));
  document.getElementById(`lbl_${gid}_${oi}`).classList.add('sel');
}

function validate(gid, bi, ci){
  if(answered[gid]) return;
  const cs = DATA.find(d => d.block===bi && DATA.filter(x=>x.block===bi).indexOf(d)===ci);
  const sel = document.querySelector(`input[name="r_${gid}"]:checked`);
  if(!sel) return;
  const val = parseInt(sel.value);
  const correct = cs.correct;
  answered[gid] = {sel: val, correct: correct, ok: val===correct, exp: document.getElementById(`exp_${gid}`).value};

  // Marcar opciones
  const labels = document.querySelectorAll(`#opts_${gid} label`);
  labels.forEach((l,i) => {
    l.style.pointerEvents = 'none';
    if(i === correct) l.classList.add('correct');
    if(i === val && val !== correct) l.classList.add('wrong');
  });

  // Feedback
  const fb = document.getElementById(`fb_${gid}`);
  if(val === correct){
    fb.className = 'feedback ok';
    fb.innerHTML = `✅ <strong>¡Correcto!</strong><br>${cs.expl}`;
  } else {
    fb.className = 'feedback bad';
    fb.innerHTML = `❌ <strong>No es correcto.</strong> La respuesta correcta es la <strong>${cs.opts[correct].charAt(0)}</strong>.<br>${cs.expl}`;
  }

  document.getElementById(`btn_${gid}`).disabled = true;
  document.getElementById(`btn_${gid}`).textContent = '✔ Validado';
  document.getElementById(`exp_${gid}`).disabled = true;

  checkFinish();
}

function checkFinish(){
  const total = DATA.length;
  const done = Object.keys(answered).length;
  if(done === total){
    document.getElementById('endTime').disabled = false;
    document.getElementById('endTime').value = new Date().toTimeString().slice(0,5);
    showResults();
  }
}

function showResults(){
  const total = DATA.length;
  const ok = Object.values(answered).filter(a=>a.ok).length;
  const pct = Math.round(ok/total*100);
  document.getElementById('scoreDisplay').textContent = `${ok} / ${total} (${pct}%)`;
  let detail = '';
  BLOCK_NAMES.forEach((b,bi) => {
    const cases = DATA.filter(d=>d.block===bi);
    const bok = cases.filter((_,ci)=> answered[`b${bi}c${ci}`] && answered[`b${bi}c${ci}`].ok).length;
    detail += `${b.name}: ${bok}/10 · `;
  });
  document.getElementById('scoreDetail').textContent = detail;
  document.getElementById('sendSection').style.display = 'block';
  document.getElementById('sendSection').scrollIntoView({behavior:'smooth'});
}

function navBlock(dir){
  document.getElementById(`block${currentBlock}`).classList.remove('active');
  currentBlock += dir;
  if(currentBlock < 0) currentBlock = 0;
  if(currentBlock >= BLOCK_NAMES.length) currentBlock = BLOCK_NAMES.length - 1;
  document.getElementById(`block${currentBlock}`).classList.add('active');
  updateNav();
  window.scrollTo({top: document.getElementById(`block${currentBlock}`).offsetTop - 20, behavior:'smooth'});
}

function updateNav(){
  document.getElementById('btnPrev').disabled = currentBlock === 0;
  document.getElementById('btnNext').disabled = currentBlock === BLOCK_NAMES.length - 1;
  document.getElementById('progressText').textContent = `Bloque ${currentBlock+1} de ${BLOCK_NAMES.length}`;
}

function startTest(){
  const name = document.getElementById('stuName').value.trim();
  const email = document.getElementById('stuEmail').value.trim();
  if(!name || !email){
    alert('Por favor, rellena al menos tu nombre y email.');
    return;
  }
  document.getElementById('startTime').value = new Date().toTimeString().slice(0,5);
  document.getElementById('stuDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('personalForm').style.display = 'none';
  document.getElementById('navBar').style.display = 'flex';
  buildBlocks();
  document.getElementById(`block0`).classList.add('active');
  updateNav();
}

function sendEmail(){
  const name = document.getElementById('stuName').value;
  const email = document.getElementById('stuEmail').value;
  const prof = document.getElementById('profEmail').value || 'professora@escuela.com';
  const date = document.getElementById('stuDate').value;
  const start = document.getElementById('startTime').value;
  const end = document.getElementById('endTime').value;
  const total = DATA.length;
  const ok = Object.values(answered).filter(a=>a.ok).length;
  const pct = Math.round(ok/total*100);

  let body = `CASOS PRÁCTICOS – SISTEMA MUSCULOESQUELÉTICO%0D%0A`;
  body += `Fisiología de la Danza · Curso 2026-2027%0D%0A%0D%0A`;
  body += `Alumno/a: ${name}%0D%0A`;
  body += `Email: ${email}%0D%0A`;
  body += `Fecha: ${date}%0D%0A`;
  body += `Hora inicio: ${start}%0D%0A`;
  body += `Hora final: ${end}%0D%0A%0D%0A`;
  body += `RESULTADO: ${ok}/${total} (${pct}%)%0D%0A%0D%0A`;

  BLOCK_NAMES.forEach((b,bi) => {
    body += `--- ${b.name} ---%0D%0A`;
    const cases = DATA.filter(d=>d.block===bi);
    cases.forEach((cs,ci) => {
      const gid = `b${bi}c${ci}`;
      const a = answered[gid];
      if(a){
        body += `Caso ${ci+1}: ${a.ok?'✅':'❌'} (Respuesta: ${cs.opts[a.sel].charAt(0)} | Correcta: ${cs.opts[a.correct].charAt(0)})%0D%0A`;
        if(a.exp) body += `  Explicación del alumno: ${a.exp}%0D%0A`;
      }
    });
    body += `%0D%0A`;
  });

  const subject = encodeURIComponent(`Casos Prácticos – ${name} – ${ok}/${total}`);
  window.location.href = `mailto:${prof}?subject=${subject}&body=${body}`;
}

// Init date
document.getElementById('stuDate').value = new Date().toISOString().slice(0,10);
</script>
