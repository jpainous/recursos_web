<!DOCTYPE html>
<html lang="ca">

<style>
  :root{
    --navy:#0b1f3a; --navy-2:#132f55;
    --gold:#c9a227; --gold-2:#e6c65c;
    --bg:#f7f4ee; --white:#ffffff;
    --text:#1a1a1a; --muted:#6b6b6b;
    --ok:#2e7d32; --ok-bg:#e8f3ec;
    --err:#c62828; --err-bg:#fdecea;
    --pi:#1b8a3a; --pi-bg:#e6f6ea; --pi-border:#8fd3a3;
    --bloc-a:#c62828; --bloc-a-bg:#fdecea;
    --bloc-b:#2e7d32; --bloc-b-bg:#e8f3ec;
    --bloc-c:#1565c0; --bloc-c-bg:#e3f0fb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family: Georgia, "Times New Roman", serif;
    background:var(--bg);
    color:var(--text);
    font-size:22px;
    line-height:1.65;
    padding:1.2rem;
  }
  .wrap{max-width:960px;margin:0 auto}

  /* ---------- CAPÇALERA ---------- */
  .menu{
    background:linear-gradient(135deg,var(--navy),var(--navy-2));
    color:#fff;border-radius:16px;padding:1rem 1.2rem;
    box-shadow:0 8px 22px rgba(11,31,58,.18);margin-bottom:1rem;
  }
  .menu h1{margin:0 0 .25rem;font-size:1.7rem;color:#fff}
  .menu .sub{margin:0 0 .8rem;color:#dbe6f5;font-size:1.05rem}
  .menu-row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between}
  .menu-row .progres{font-size:1.05rem;color:var(--gold-2);font-weight:700}
  .menu-row .controls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
  .menu-row button{
    background:var(--gold);color:var(--navy);border:0;
    padding:.6rem 1.15rem;border-radius:999px;
    font-family:inherit;font-weight:700;font-size:.95rem;cursor:pointer;
  }
  .menu-row button:hover{background:var(--gold-2)}
  .menu-row button.ghost{background:transparent;color:#fff;border:1px solid rgba(230,198,92,.6)}
  .menu-row button.ghost:hover{background:rgba(230,198,92,.15)}
  .menu-row button.actiu{
    background:var(--pi);color:#fff;border-color:var(--pi);
    box-shadow:0 0 0 3px rgba(27,138,58,.25);
  }
  #btn-adaptat{
    font-size:1.15rem;padding:.5rem .75rem;line-height:1;
    display:none;
  }
  #btn-adaptat.actiu{
    display:inline-flex;
    background:var(--pi);color:#fff;border-color:var(--pi);
  }
  .lang-switch{display:flex;gap:.35rem;margin-top:.7rem}
  .lang-switch button{
    background:rgba(255,255,255,.08);color:#fff;
    border:1px solid rgba(230,198,92,.5);
    padding:.35rem .85rem;border-radius:999px;
    font-family:inherit;font-size:.9rem;cursor:pointer;
  }
  .lang-switch button.active{background:var(--gold);color:var(--navy);font-weight:700}

  /* ---------- ÍNDEX ---------- */
  .index{
    background:#fff;border-radius:16px;
    box-shadow:0 6px 18px rgba(11,31,58,.08);
    margin-bottom:1rem;overflow:hidden;
  }
  .index-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:1rem 1.2rem;cursor:pointer;
    background:#fbf8f1;border:0;width:100%;
    font-family:inherit;font-size:1.1rem;font-weight:700;
    color:var(--navy);text-align:left;
  }
  .index-header:hover{background:#f5efdf}
  .index-header .arrow{transition:transform .25s;font-size:1.1rem;color:var(--gold)}
  .index-header.open .arrow{transform:rotate(90deg)}
  .index-body{
    max-height:0;overflow:hidden;
    transition:max-height .4s ease;
    padding:0 1.2rem;
  }
  .index-body.open{max-height:3000px;padding:.4rem 1.2rem 1.2rem}
  .index-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem}
  @media (max-width:640px){.index-grid{grid-template-columns:1fr}}
  .bloc-wrap{display:flex;flex-direction:column}

  .bloc-btn{
    text-align:left;background:#fff;border:2px solid #e0dccf;border-radius:12px;
    padding:.8rem .9rem;cursor:pointer;font-family:inherit;font-size:1rem;
    color:var(--navy);transition:all .15s;
    display:flex;flex-direction:column;gap:.25rem;
  }
  .bloc-btn:hover{transform:translateY(-1px)}
  .bloc-btn.active{box-shadow:0 0 0 3px rgba(201,162,39,.35)}
  .bloc-btn .bloc-titol{font-weight:700;font-size:1.05rem}
  .bloc-btn .bloc-meta{font-size:.85rem;color:#666}
  .bloc-btn .bloc-meta .pi{color:var(--pi);font-weight:700}
  .bloc-btn .barra{height:8px;background:#eee;border-radius:999px;overflow:hidden;margin-top:.3rem}
  .bloc-btn .barra span{display:block;height:100%;width:0%;transition:width .3s}
  .bloc-btn[data-bloc="A"]{border-left:7px solid var(--bloc-a);background:linear-gradient(90deg,#fff,var(--bloc-a-bg))}
  .bloc-btn[data-bloc="B"]{border-left:7px solid var(--bloc-b);background:linear-gradient(90deg,#fff,var(--bloc-b-bg))}
  .bloc-btn[data-bloc="C"]{border-left:7px solid var(--bloc-c);background:linear-gradient(90deg,#fff,var(--bloc-c-bg))}
  .bloc-btn[data-bloc="A"] .barra span{background:var(--bloc-a)}
  .bloc-btn[data-bloc="B"] .barra span{background:var(--bloc-b)}
  .bloc-btn[data-bloc="C"] .barra span{background:var(--bloc-c)}

  /* ---------- BOTÓ OBJECTIU ---------- */
  .objectiu-toggle{
    display:block;width:100%;margin-top:.7rem;background:#fff;
    border:1px dashed var(--gold);color:var(--navy);
    padding:.6rem 1rem;border-radius:10px;font-family:inherit;
    font-size:.98rem;font-weight:700;cursor:pointer;text-align:left;
  }
  .objectiu-toggle:hover{background:#fff8e1}
  .objectiu-panel{
    display:none;margin-top:.7rem;background:#fffdf5;
    border-left:5px solid var(--gold);border-radius:10px;
    padding:1rem 1.1rem;font-size:.98rem;color:#333;
  }
  .objectiu-panel.open{display:block}
  .objectiu-panel h4{
    margin:.9rem 0 .35rem;color:var(--navy);font-size:.95rem;
    text-transform:uppercase;letter-spacing:.05em;
  }
  .objectiu-panel h4:first-child{margin-top:0}
  .objectiu-panel p{margin:.2rem 0 .6rem}
  .objectiu-panel ul{margin:.2rem 0 .6rem;padding-left:1.3rem}
  .objectiu-panel li{margin:.2rem 0}
  .objectiu-panel .vocab{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.3rem}
  .objectiu-panel .vocab span{
    background:var(--navy);color:#fff;border-radius:999px;
    padding:.25rem .75rem;font-size:.88rem;
  }
  .objectiu-panel .objectiu-pi{
    background:var(--pi-bg);border-left:5px solid var(--pi);
    border-radius:8px;padding:.7rem .9rem;margin-top:.7rem;
  }
  .objectiu-panel .objectiu-pi h4{color:var(--pi);margin-top:0}
  .objectiu-toggle-card{
    margin-top:1rem;background:#fbf8f1;
    font-size:1rem;padding:.7rem 1.1rem;
  }

  /* ---------- TARGETA ---------- */
  .card{
    background:#fff;border-radius:18px;
    padding:1.6rem 1.5rem 1.8rem;
    box-shadow:0 10px 26px rgba(11,31,58,.10);
    border-top:8px solid var(--gold);
    transition:border-color .25s;
    position:relative;
  }
  .card[data-bloc="A"]{border-top-color:var(--bloc-a)}
  .card[data-bloc="B"]{border-top-color:var(--bloc-b)}
  .card[data-bloc="C"]{border-top-color:var(--bloc-c)}
  .card.pi{box-shadow:0 0 0 3px var(--pi-border), 0 10px 26px rgba(11,31,58,.10)}

  .bloc-tag{
    display:inline-block;font-size:.85rem;font-weight:700;
    padding:.25rem .7rem;border-radius:999px;margin-bottom:.6rem;
    color:#fff;letter-spacing:.04em;
  }
  .bloc-tag[data-bloc="A"]{background:var(--bloc-a)}
  .bloc-tag[data-bloc="B"]{background:var(--bloc-b)}
  .bloc-tag[data-bloc="C"]{background:var(--bloc-c)}

  .pi-badge{
    display:none;float:right;align-items:center;justify-content:center;
    background:var(--pi-bg);color:var(--pi);border:1px solid var(--pi-border);
    border-radius:999px;padding:.25rem .65rem;font-size:1rem;font-weight:700;
    min-width:36px;
  }
  .card.pi-obligatoria .pi-badge{display:inline-flex}

  .icon{font-size:3.4rem;text-align:center;margin-bottom:.3rem}
  .situacio{
    font-size:1.35rem;color:var(--navy);font-weight:700;
    text-align:center;margin:.2rem 0 .7rem;
  }
  .pregunta{font-size:1.2rem;color:#333;text-align:center;margin:0 0 1.3rem}
  .pregunta strong{color:var(--navy)}

  .opcions{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
  .opcions button{
    flex:1 1 280px;padding:1.15rem 1rem;border-radius:14px;
    border:2px solid var(--navy);background:#fff;font-family:inherit;
    font-size:1.1rem;font-weight:700;color:var(--navy);cursor:pointer;
    transition:all .15s;line-height:1.35;
  }
  .opcions button span{
    display:block;font-size:.95rem;font-weight:400;
    color:#555;margin-top:.3rem;
  }
  .opcions button:hover:not(:disabled){background:var(--navy);color:#fff}
  .opcions button:hover:not(:disabled) span{color:#dbe6f5}
  .opcions button:disabled{cursor:default;opacity:.9}

  .feedback{
    margin-top:1.3rem;padding:1.1rem 1.2rem;border-radius:12px;
    font-size:1.1rem;display:none;
  }
  .feedback.ok{background:var(--ok-bg);color:#1b5e20;border-left:6px solid var(--ok);display:block}
  .feedback.err{background:var(--err-bg);color:#8a1c1c;border-left:6px solid var(--err);display:block}
  .feedback strong{display:block;margin-bottom:.25rem}

  .info-toggle{
    display:block;margin:1.3rem auto 0;background:#fff;
    border:1px solid var(--gold);color:var(--navy);
    padding:.6rem 1.2rem;border-radius:999px;font-family:inherit;
    font-size:1rem;font-weight:700;cursor:pointer;
  }
  .info-toggle:hover{background:#fff8e1}
  .info-panel{
    display:none;margin-top:.9rem;background:#fffdf5;
    border-left:5px solid var(--gold);border-radius:10px;
    padding:1rem 1.2rem;font-size:1.05rem;color:#333;
  }
  .info-panel.open{display:block}
  .info-panel h3{margin:0 0 .4rem;color:var(--navy);font-size:1.1rem}
  .info-panel p{margin:.2rem 0 .6rem}
  .info-panel .exemple{
    background:#fff;border-radius:8px;padding:.7rem .9rem;
    font-size:1rem;border:1px dashed var(--gold);
  }
  .info-panel a{
    color:var(--navy);font-weight:700;text-decoration:none;
    border-bottom:1px solid var(--gold);
  }
  .info-panel a:hover{color:var(--gold)}

  .nav-next{
    text-align:center;margin-top:1.3rem;
    display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;
  }
  .nav-next button{
    background:var(--gold);color:var(--navy);border:0;
    padding:.8rem 1.5rem;border-radius:999px;
    font-family:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;
  }
  .nav-next button:hover{background:var(--gold-2)}
  .nav-next button.ghost{background:#fff;color:var(--navy);border:1px solid var(--gold)}

  .resum{text-align:center;padding:1rem 0}
  .resum .icon{font-size:3.8rem}
  .resum .missatge{
    font-size:1.4rem;color:var(--navy);font-weight:700;margin:.5rem 0 .7rem;
  }
  .resum p{color:#555;font-size:1.05rem;margin:.2rem 0 1rem}

  @media (max-width:640px){
    body{font-size:19px;padding:.9rem}
    .menu h1{font-size:1.35rem}
    .opcions button{flex:1 1 100%}
    .situacio{font-size:1.2rem}
  }

  @media print{
    body{background:#fff;font-size:12pt}
    .menu{
      background:#fff;color:#0b1f3a;border:0;box-shadow:none;
      border-bottom:3px solid var(--gold);border-radius:0;
    }
    .menu h1,.menu .sub,.menu .progres{color:#0b1f3a}
    .menu-row button,.lang-switch{display:none}
    .index{display:none}
    .card{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid}
  }
</style>

/* ------------------------------------------------------------
   DESAMENT
   ------------------------------------------------------------ */
function carregarEstat(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return { idxActual:0, respostes:{}, blocActual:null, modeAdaptat:false };
    const p = JSON.parse(raw);
    return {
      idxActual: p.idxActual || 0,
      respostes: p.respostes || {},
      blocActual: p.blocActual || null,
      modeAdaptat: !!p.modeAdaptat
    };
  }catch(e){
    return { idxActual:0, respostes:{}, blocActual:null, modeAdaptat:false };
  }
}
function desarEstat(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(estat)); }catch(e){}
}

/* ------------------------------------------------------------
   FILTRES
   ------------------------------------------------------------ */
function getIndexosVisibles(){
  let visibles = PREGUNTES.map((_,i)=>i);
  if(modeRepas){
    visibles = visibles.filter(i => {
      const resp = estat.respostes[i];
      return resp === undefined || resp !== PREGUNTES[i].correcte;
    });
  }
  return visibles;
}
function totalMarcades(){ return PREGUNTES.filter(p => p.pi).length; }

/* ------------------------------------------------------------
   BOTONS D'ESTAT
   ------------------------------------------------------------ */
function actualitzarBotoRepas(){
  const t = UI[currentLang];
  elBtnRepas.textContent = modeRepas ? t.repasActiu : t.repas;
  elBtnRepas.classList.toggle("actiu", modeRepas);
  elBtnRepas.classList.toggle("ghost", !modeRepas);
}
function actualitzarBotoAdaptat(){
  // El botó verd NOMÉS es mostra quan està actiu
  if(modeAdaptat){
    elBtnAdaptat.classList.add("actiu");
    elBtnAdaptat.style.display = "inline-flex";
  } else {
    elBtnAdaptat.classList.remove("actiu");
    elBtnAdaptat.style.display = "none";
  }
}

/* ------------------------------------------------------------
   OBJECTIUS
   ------------------------------------------------------------ */
function htmlObjectiu(blocId){
  const obj = OBJECTIUS[blocId];
  const lang = currentLang;
  const t = UI[lang];
  const g = obj.general;
  const a = obj.adaptat;
  return `
    <h4>${t.objectiuGeneral}</h4>
    <p>${g.que[lang]}</p>
    <ul>${g.clau[lang].map(c => `<li>${c}</li>`).join("")}</ul>
    <p>${g.importancia[lang]}</p>
    <div class="objectiu-pi">
      <h4>${t.objectiuAdaptat}</h4>
      <p>${a.que[lang]}</p>
      <ul>${a.clau[lang].map(c => `<li>${c}</li>`).join("")}</ul>
      <p>${a.importancia[lang]}</p>
    </div>
    <h4>${t.vocabulari}</h4>
    <div class="vocab">${obj.vocabulari[lang].map(v => `<span>${v}</span>`).join("")}</div>
  `;
}
function toggleObjectiu(blocId, contenidor){
  const existent = contenidor.querySelector(".objectiu-panel");
  if(existent){
    existent.classList.toggle("open");
    return;
  }
  const panel = document.createElement("div");
  panel.className = "objectiu-panel open";
  panel.innerHTML = htmlObjectiu(blocId);
  contenidor.appendChild(panel);
}

/* ------------------------------------------------------------
   INDEX DE BLOCS
   ------------------------------------------------------------ */
function renderIndex(){
  elIndexGrid.innerHTML = "";
  const blocs = BLOCS[currentLang];
  blocs.forEach(b => {
    const items = PREGUNTES.map((p,i)=>({...p, idxGlobal:i})).filter(p => p.bloc === b.id);
    const marcades = items.filter(p => p.pi);
    const fetes = items.filter(p => estat.respostes[p.idxGlobal] !== undefined).length;
    const fetesMarc = marcades.filter(p => estat.respostes[p.idxGlobal] !== undefined).length;
    const total = items.length;
    const totalMarc = marcades.length;
    const pct = total ? (fetes/total)*100 : 0;

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "bloc-btn" + (estat.blocActual === b.id ? " active" : "");
    btn.dataset.bloc = b.id;
    btn.innerHTML = `
      <span class="bloc-titol">Bloc ${b.id} · ${b.titol}</span>
      <span class="bloc-meta">${fetes} / ${total} · <span class="pi">${fetesMarc} / ${totalMarc} 🌿</span></span>
      <span class="barra"><span style="width:${pct}%"></span></span>
    `;
    btn.addEventListener("click", () => {
      const primeraNoFeta = items.find(p => estat.respostes[p.idxGlobal] === undefined) || items[0];
      estat.blocActual = b.id;
      idx = primeraNoFeta.idxGlobal;
      desarEstat();
      render();
      renderIndex();
      elIndexBody.classList.remove("open");
      elIndexHead.classList.remove("open");
    });

    const wrap = document.createElement("div");
    wrap.className = "bloc-wrap";
    wrap.appendChild(btn);

    const btnObj = document.createElement("button");
    btnObj.type = "button";
    btnObj.className = "objectiu-toggle";
    btnObj.textContent = UI[currentLang].objectiu;
    btnObj.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleObjectiu(b.id, wrap);
    });
    wrap.appendChild(btnObj);

    elIndexGrid.appendChild(wrap);
  });
}

/* ------------------------------------------------------------

   ------------------------------------------------------------ */
function aplicarUI(){
  const t = UI[currentLang];
  document.documentElement.lang = currentLang;
  document.getElementById("ui-titol").textContent = t.titol;
  document.getElementById("ui-sub").textContent = t.sub;
  document.getElementById("btn-reset").textContent = t.reset;
  document.getElementById("btn-continuar").textContent = t.continuar;
  document.getElementById("btn-exportar").textContent = t.exportar;
  document.getElementById("btn-imprimir").textContent = t.imprimir;
  document.getElementById("ui-index-titol").textContent = t["index-titol"];
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if(t[key]) el.textContent = t[key];
  });
  elNext.textContent = t.seguent;
  elPrev.textContent = t.anterior;
  elBtnObjCard.textContent = elObjCard.classList.contains("open") ? t.tancarObjectiu : t.objectiu;
  document.querySelectorAll(".lang-switch button").forEach(b => {
    b.classList.toggle("active", b.dataset.lang === currentLang);
  });
  actualitzarBotoRepas();
  actualitzarBotoAdaptat();
}

  if(modeRepas){
    const visibles = getIndexosVisibles();
    elProgres.textContent = t.repasInfo(visibles.length);
    return;
  }
  if(modeAdaptat){
    const fetes = PREGUNTES.filter((p,i) => p.pi && estat.respostes[i] !== undefined).length;
    elProgres.textContent = t.progresAdaptat(fetes, totalMarcades());
  } else {
    const fetes = Object.keys(estat.respostes).length;
    elProgres.textContent = t.progresGlobal(fetes, PREGUNTES.length);
  }
}

/* ------------------------------------------------------------
   RENDER PREGUNTA
   ------------------------------------------------------------ */
function render(){
  const visibles = getIndexosVisibles();
  const t = UI[currentLang];
  const lang = currentLang;

  if(visibles.length === 0){
    elCard.dataset.bloc = "A";
    elCard.classList.remove("pi-obligatoria","pi");
    elCard.innerHTML = `
      <div class="resum">
        <div class="icon">✅</div>
        <div class="missatge">${t.repasBuit}</div>
        <div class="nav-next">
          <button id="sortir-repas">${t.repas}</button>
        </div>
      </div>
    `;
    document.getElementById("sortir-repas").addEventListener("click", () => {
      modeRepas = false;
      actualitzarBotoRepas();
      render();
      renderIndex();
    });
    actualitzarProgresGlobal();
    return;
  }

  if(!visibles.includes(idx)){
    idx = visibles[0];
  }

  respost = false;
  const p = PREGUNTES[idx];
  const pi = !!p.pi;

  estat.idxActual = idx;
  estat.blocActual = p.bloc;
  desarEstat();

  elCard.dataset.bloc = p.bloc;
  elCard.classList.toggle("pi-obligatoria", pi);
  elCard.classList.toggle("pi", pi && modeAdaptat);
  elBlocTag.dataset.bloc = p.bloc;
  const blocInfo = BLOCS[lang].find(b => b.id === p.bloc);
  elBlocTag.textContent = `Bloc ${p.bloc} · ${blocInfo.titol}`;

  elIcon.textContent = p.icon;
  elSituacio.textContent = p.situacio[lang];
  elPregunta.innerHTML = p.pregunta[lang];

  elFeedback.className = "feedback";
  elFeedback.innerHTML = "";
  elNext.style.display = "inline-block";
  elPrev.style.display = "inline-block";

  elInfoPanel.classList.remove("open");
  elBtnInfo.textContent = t["mes-info"];
  elInfoTitol.textContent = p.info.titol[lang];
  elInfoText.textContent = p.info.text[lang];
  elInfoEx.textContent = p.info.exemple[lang];
  elInfoLink.href = BASE_URL + p.recurs;

  elObjCard.innerHTML = htmlObjectiu(p.bloc);
  elObjCard.classList.remove("open");
  elBtnObjCard.textContent = t.objectiu;

  elOpcions.style.display = "flex";
  elOpcions.querySelectorAll("button").forEach(b => {
    b.disabled = false;
    b.style.background = "#fff";
    b.style.color = "#0b1f3a";
    b.style.borderColor = "#0b1f3a";
  });

  if(estat.respostes[idx] !== undefined){
    mostrarResposta(estat.respostes[idx]);
  }

  actualitzarProgresGlobal();
}

/* ------------------------------------------------------------
   MOSTRAR RESPOSTA
   ------------------------------------------------------------ */
function mostrarResposta(resp){
  respost = true;
  const p = PREGUNTES[idx];
  const t = UI[currentLang];
  const correcte = resp === p.correcte;
  if(correcte){
    elFeedback.className = "feedback ok";
    elFeedback.innerHTML = `<strong>${t.correcte}</strong>${p.explica[currentLang]}`;
  } else {
    elFeedback.className = "feedback err";
    elFeedback.innerHTML = `<strong>${t.incorrecte}</strong>${p.explica[currentLang]}`;
  }
  elOpcions.querySelectorAll("button").forEach(x => {
    x.disabled = true;
    if(x.dataset.resp === p.correcte){
      x.style.background = "#e8f3ec";
      x.style.borderColor = "#2e7d32";
    } else if(x.dataset.resp === resp){
      x.style.background = "#fdecea";
      x.style.borderColor = "#c62828";
    }
  });
}

/* ------------------------------------------------------------
   RESPOSTA
   ------------------------------------------------------------ */
elOpcions.querySelectorAll("button").forEach(b => {
  b.addEventListener("click", () => {
    if(respost) return;
    estat.respostes[idx] = b.dataset.resp;
    desarEstat();
    mostrarResposta(b.dataset.resp);
    renderIndex();
    actualitzarProgresGlobal();
  });
});

/* ------------------------------------------------------------
   INFORMACIÓ / OBJECTIU
   ------------------------------------------------------------ */
elBtnInfo.addEventListener("click", () => {
  const t = UI[currentLang];
  const obert = elInfoPanel.classList.toggle("open");
  elBtnInfo.textContent = obert ? t["menys-info"] : t["mes-info"];
});
elBtnObjCard.addEventListener("click", () => {
  const t = UI[currentLang];
  const obert = elObjCard.classList.toggle("open");
  elBtnObjCard.textContent = obert ? t.tancarObjectiu : t.objectiu;
});

/* ------------------------------------------------------------
   NAVEGACIÓ
   ------------------------------------------------------------ */
elNext.addEventListener("click", () => {
  const visibles = getIndexosVisibles();
  const pos = visibles.indexOf(idx);
  if(pos < visibles.length - 1){
    idx = visibles[pos+1];
    render();
    renderIndex();
  } else {
    mostrarResum();
  }
});
elPrev.addEventListener("click", () => {
  const visibles = getIndexosVisibles();
  const pos = visibles.indexOf(idx);
  if(pos > 0){
    idx = visibles[pos-1];
    render();
    renderIndex();
  }
});

/* ------------------------------------------------------------
   RESUM
   ------------------------------------------------------------ */
function mostrarResum(){
  const t = UI[currentLang];
  let encerts = 0, encertsMarc = 0;
  PREGUNTES.forEach((p,i) => {
    if(estat.respostes[i] === p.correcte){
      encerts++;
      if(p.pi) encertsMarc++;
    }
  });
  elCard.classList.remove("pi-obligatoria","pi");
  elCard.innerHTML = `
    <div class="resum">
      <div class="icon">🎯</div>
      <div class="missatge">${t.resumGlobal(encerts, PREGUNTES.length)}</div>
      <p>${t.resumSub}</p>
      <p><strong>🌿 Objectiu:</strong> ${encertsMarc} / ${totalMarcades()}</p>
      <div class="nav-next">
        <button id="tornar">${t.tornar}</button>
      </div>
    </div>
  `;
  document.getElementById("tornar").addEventListener("click", () => {
    if(confirm(t.confirmReset)){
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }
  });
}

/* ------------------------------------------------------------
   BOTONS CAPÇALERA
   ------------------------------------------------------------ */
document.getElementById("btn-reset").addEventListener("click", () => {
  if(confirm(UI[currentLang].confirmReset)){
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
});
document.getElementById("btn-continuar").addEventListener("click", () => {
  idx = estat.idxActual || 0;
  render();
  renderIndex();
});

/* ------------------------------------------------------------
   MODE REPÀS
   ------------------------------------------------------------ */
elBtnRepas.addEventListener("click", () => {
  const t = UI[currentLang];
  if(!modeRepas){
    const pendents = getIndexosVisibles();
    if(pendents.length === 0){
      alert(t.repasBuit);
      return;
    }
    modeRepas = true;
    idx = pendents[0];
  } else {
    modeRepas = false;
  }
  actualitzarBotoRepas();
  render();
  renderIndex();
});

/* ------------------------------------------------------------
   MODE ADAPTAT (botó verd)
   ------------------------------------------------------------ */
elBtnAdaptat.addEventListener("click", () => {
  modeAdaptat = !modeAdaptat;
  estat.modeAdaptat = modeAdaptat;
  desarEstat();
  actualitzarBotoAdaptat();
  render();
  renderIndex();
});

/* ------------------------------------------------------------
   EXPORTAR
   ------------------------------------------------------------ */
document.getElementById("btn-exportar").addEventListener("click", () => {
  const t = UI[currentLang];
  let encerts=0, encertsMarc=0, fetes=0, fetesMarc=0;
  const detall = PREGUNTES.map((p,i) => {
    const resp = estat.respostes[i];
    const ok = resp === p.correcte;
    if(resp !== undefined){ fetes++; if(p.pi) fetesMarc++; }
    if(ok){ encerts++; if(p.pi) encertsMarc++; }
    return {
      num:i+1, bloc:p.bloc, pi:p.pi,
      situacio:p.situacio.ca, correcte:p.correcte,
      resposta: resp||null,
      encert: resp===undefined ? null : ok
    };
  });

  const data = {
    activitat:"T1.2 · De la cèl·lula al cos",
    data_exportacio:new Date().toISOString(),
    idioma_actual:currentLang,
    mode_adaptat:modeAdaptat,
    total_preguntes:PREGUNTES.length,
    total_marcades_objectiu:totalMarcades(),
    respostes_fetes:fetes,
    respostes_marcades_fetes:fetesMarc,
    encerts:encerts,
    encerts_marcades:encertsMarc,
    detall
  };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `t1_activitat02_progres_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  alert(t.exportat);
});

/* ------------------------------------------------------------
   IMPRIMIR
   ------------------------------------------------------------ */
document.getElementById("btn-imprimir").addEventListener("click", () => {
  const t = UI[currentLang], lang = currentLang;
  let encerts=0, fetes=0, encertsMarc=0, fetesMarc=0;
  const perBloc = {};
  BLOCS[lang].forEach(b => perBloc[b.id] = { encerts:0, total:0, fetes:0, piTotal:0, piEncerts:0 });

  PREGUNTES.forEach((p,i) => {
    perBloc[p.bloc].total++;
    if(p.pi) perBloc[p.bloc].piTotal++;
    const resp = estat.respostes[i];
    if(resp !== undefined){
      fetes++;
      if(p.pi) fetesMarc++;
      perBloc[p.bloc].fetes++;
      if(resp === p.correcte){
        encerts++;
        if(p.pi){ encertsMarc++; perBloc[p.bloc].piEncerts++; }
        perBloc[p.bloc].encerts++;
      }
    }
  });

  const pct = PREGUNTES.length ? Math.round((encerts/PREGUNTES.length)*100) : 0;
  const pctMarc = totalMarcades() ? Math.round((encertsMarc/totalMarcades())*100) : 0;

  const filesBloc = BLOCS[lang].map(b => {
    const d = perBloc[b.id];
    return `<tr><td>${b.id} · ${b.titol}</td><td>${d.encerts} / ${d.total}</td><td>${d.piEncerts} / ${d.piTotal}</td></tr>`;
  }).join("");

  const filesDetall = PREGUNTES.map((p,i) => {
    const resp = estat.respostes[i];
    const correcte = resp === p.correcte;
    const est = resp===undefined ? t.imprimirPendent : (correcte ? t.imprimirSi : t.imprimirNo);
    const color = resp===undefined ? "#999" : (correcte ? "#2e7d32" : "#c62828");
    return `<tr>
      <td>${i+1}</td>
      <td>${p.bloc}</td>
      <td>${p.pi ? "🌿" : "—"}</td>
      <td>${p.situacio[lang]}</td>
      <td>${resp||"—"}</td>
      <td>${p.correcte}</td>
      <td style="color:${color};font-weight:700">${est}</td>
    </tr>`;
  }).join("");

  const html = `<!DOCTYPE html><html lang="${lang}"><head><meta charset="UTF-8">
    <title>${t.imprimirTitol}</title>
    <style>
      body{font-family:Georgia,serif;color:#1a1a1a;padding:1.5rem;font-size:12pt}
      h1{color:#0b1f3a;font-size:18pt;margin:0 0 .3rem}
      h2{color:#0b1f3a;font-size:14pt;margin:1.2rem 0 .4rem;border-bottom:2px solid #c9a227;padding-bottom:.2rem}
      .meta{display:flex;gap:2rem;margin-bottom:1rem;font-size:11pt}
      .meta span{display:inline-block;border-bottom:1px solid #999;min-width:180px}
      table{width:100%;border-collapse:collapse;margin:.6rem 0;font-size:10.5pt}
      th,td{border:1px solid #ccc;padding:.35rem .5rem;text-align:left;vertical-align:top}
      th{background:#f0f4fa;color:#0b1f3a}
      .resum-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem 1.5rem;font-size:11pt}
      .resum-grid div{padding:.3rem 0}
      @media print{body{padding:0}}
    </style></head><body>
    <h1>${t.imprimirTitol}</h1>
    <div class="meta">
      <div>${t.imprimirAlumne} <span></span></div>
      <div>${t.imprimirData} <span>${new Date().toLocaleDateString()}</span></div>
    </div>
    <h2>${t.imprimirResum}</h2>
    <div class="resum-grid">
      <div><strong>${t.imprimirTotal}:</strong> ${PREGUNTES.length}</div>
      <div><strong>${t.imprimirFetes}:</strong> ${fetes}</div>
      <div><strong>${t.imprimirEncerts}:</strong> ${encerts}</div>
      <div><strong>${t.imprimirPct}:</strong> ${pct} %</div>
      <div><strong>🌿 fetes:</strong> ${fetesMarc} / ${totalMarcades()}</div>
      <div><strong>🌿 encerts:</strong> ${encertsMarc} / ${totalMarcades()} (${pctMarc} %)</div>
    </div>
    <h2>${t.imprimirPerBloc}</h2>
    <table><thead><tr><th>${t.imprimirBloc}</th><th>${t.imprimirEncerts}</th><th>🌿</th></tr></thead><tbody>${filesBloc}</tbody></table>
    <h2>${t.imprimirDetall}</h2>
    <table><thead><tr>
      <th>${t.imprimirNum}</th><th>${t.imprimirBloc}</th><th>🌿</th>
      <th>${t.imprimirSituacio}</th><th>${t.imprimirResposta}</th>
      <th>${t.imprimirCorrecta}</th><th>${t.imprimirEncert}</th>
    </tr></thead><tbody>${filesDetall}</tbody></table>
    </body></html>`;

  const win = window.open("", "_blank");
  win.document.write(html);
  win.document.close();
  win.focus();
  setTimeout(() => win.print(), 300);
});

/* ------------------------------------------------------------
   ÍNDEX PLEGABLE
   ------------------------------------------------------------ */
elIndexHead.addEventListener("click", () => {
  const obert = elIndexBody.classList.toggle("open");
  elIndexHead.classList.toggle("open", obert);
});

/* ------------------------------------------------------------
   IDIOMA
   ------------------------------------------------------------ */
document.querySelectorAll(".lang-switch button").forEach(b => {
  b.addEventListener("click", () => {
    currentLang = b.dataset.lang;
    aplicarUI();
    render();
    renderIndex();
  });
});

/* ------------------------------------------------------------
   INICI
   ------------------------------------------------------------ */
aplicarUI();
modeAdaptat = !!estat.modeAdaptat;
actualitzarBotoAdaptat();
actualitzarBotoRepas();
idx = estat.idxActual || 0;
render();
renderIndex();
</script>
</body>
</html>
